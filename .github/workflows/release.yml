# Publishes a release with the app file held on the dist branch.
# Run it from the Actions tab and give the version, such as 1.22.1.
name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, such as 1.22.1
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dist
      - name: Check the file
        run: sha256sum -c SHA256SUMS
      - name: Publish the release
        run: gh release create "v${{ inputs.version }}" Shelfmark.apk --target main --title "Shelfmark ${{ inputs.version }}" --notes-file NOTES.md
        env:
          GH_TOKEN: ${{ github.token }}
